name: Deploy

# Runs only when CI passes on main.
# The `ci.yml` workflow validates first; this one builds images and deploys.
on:
  workflow_run:
    workflows: [CI]
    branches:  [main]
    types:     [completed]

# Needed to push to ghcr.io with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  REGISTRY:     ghcr.io
  PORTAL_IMAGE: ghcr.io/${{ github.repository_owner }}/unc-portal
  CMS_IMAGE:    ghcr.io/${{ github.repository_owner }}/unc-portal-cms

jobs:
  # ── Guard: only proceed when CI workflow succeeded ─────────────────────────
  check-ci:
    name: CI gate
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding to build and deploy"

  # ── Build & push Docker images to ghcr.io ──────────────────────────────────
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    needs: check-ci

    strategy:
      matrix:
        include:
          - name:       portal
            image:      ghcr.io/${{ github.repository_owner }}/unc-portal
            context:    .
            dockerfile: Dockerfile

          - name:       cms
            image:      ghcr.io/${{ github.repository_owner }}/unc-portal-cms
            context:    ./apps/cms
            dockerfile: ./apps/cms/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch the commit that triggered the CI run
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          cache-to:   type=registry,ref=${{ matrix.image }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
        # build-args only apply to the portal build; CMS ignores unknown args safely

  # ── Deploy to production server via SSH ────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-images
    environment: production   # uses GitHub environment protection rules

    steps:
      - name: Checkout (for compose files)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy compose + nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:        ${{ secrets.SSH_HOST }}
          username:    ${{ secrets.SSH_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.SSH_PORT || 22 }}
          source:      "infrastructure/"
          target:      "/opt/unc-portal/"
          strip_components: 0

      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/unc-portal

            # Authenticate to ghcr.io on the server (uses a read-only PAT)
            echo "${{ secrets.GHCR_READ_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images before stopping the running containers
            docker compose \
              -f infrastructure/docker/compose.prod.yaml \
              --env-file infrastructure/docker/.env.prod \
              pull

            # Zero-downtime restart: bring up new containers, then clean old ones
            docker compose \
              -f infrastructure/docker/compose.prod.yaml \
              --env-file infrastructure/docker/.env.prod \
              up -d --remove-orphans

            # Remove dangling images to keep disk clean
            docker image prune -f

            echo "✅ Deploy complete — $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            # Give containers 20s to finish starting before health check
            sleep 20

            portal_status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 https://portal.unc.edu.py/api/health || echo "000")

            cms_status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 https://cms.unc.edu.py/api/health || echo "000")

            echo "Portal: $portal_status | CMS: $cms_status"

            if [ "$portal_status" != "200" ] || [ "$cms_status" != "200" ]; then
              echo "::error::Health check failed — portal=$portal_status, cms=$cms_status"
              exit 1
            fi

            echo "✅ Both services healthy"
