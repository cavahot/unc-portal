# ============================================================
# Portal UNC — Nginx Reverse Proxy (Production)
# ============================================================
# Hosts servidos (DOMINIOS-SSL-01; spec en docs/specs/infra/DOMINIOS-SSL-01.md):
#   www.unc.edu.py  -> portal:3000  (portal Next.js)
#                      + `^~ /api/media/file/` -> cms:3000 (media pública, SOLO GET/HEAD)
#                      + `^~ /archivos/`       -> S3 SeaweedFS (OPCIONAL, perfil `s3`; ver templates/)
#   cms.unc.edu.py  -> cms:3000     (panel y API de Payload)
# No existe un host de archivos aparte: el VPS tiene UN solo certificado comercial y vale solo para www.
#
# Certificados (carpeta infrastructure/nginx/certs/, fuera de git):
#   www_fullchain.pem + www_privkey.pem  Sectigo comercial (renovación MANUAL anual; ver DEPLOY.md)
#   cms_fullchain.pem + cms_privkey.pem  Let's Encrypt gratuito (certbot; renovación automática)
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # Apply to CMS login to slow brute-force attempts.
    limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;

    # NGX-01: límite de tasa SOLO para `POST /api/media` (subida de archivos al CMS). limit_req no filtra
    # por método, así que la clave se calcula con map: vacía para todo método distinto de POST (nginx no
    # cuenta las peticiones con clave vacía) y la IP del cliente para POST. 10r/m con burst=5 (en la
    # location) permite una tanda corta de subidas de un editor y frena un abuso que llene el volumen
    # de media. Amenaza: editor comprometido o script que sube sin freno. Límite: la cuenta es por IP
    # (varios editores tras una misma IP comparten cupo; un atacante con muchas IP lo evita) y una carga
    # masiva legítima (cargador de imágenes) debe correr contra la red interna o con el límite
    # subido temporalmente; ver MIG-IMG §16.3.
    map $request_method $media_write_key {
        default "";
        POST    $binary_remote_addr;
    }
    limit_req_zone $media_write_key zone=cms_media:10m rate=10r/m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream portal_upstream {
        server portal:3000;
        keepalive 32;
    }

    upstream cms_upstream {
        server cms:3000;
        keepalive 16;
    }

    # MIN-01: no hay `upstream` hacia el almacén S3. Un `upstream` estático hacia el contenedor s3 se resuelve al ARRANCAR
    # nginx y, si el contenedor s3 no existe (perfil s3 apagado), nginx aborta con «host not found in upstream»
    # y se caen portal y cms. la ruta /archivos/ del host www lo resuelve en cada petición (ver su server).

    # ── HTTP → HTTPS redirect (all domains) ───────────────────────────────────
    server {
        listen 80;
        server_name www.unc.edu.py cms.unc.edu.py;

        location /.well-known/acme-challenge/ {
            # Desafío HTTP-01 de Let's Encrypt (solo cms.unc.edu.py; www usa Sectigo). El directorio se monta
            # en el contenedor desde el host (compose.prod.yaml) para que `certbot --webroot` escriba ahí con
            # nginx en marcha. Límite: solo sirve archivos de ese directorio; todo lo demás va al 301.
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── www.unc.edu.py (portal + media pública) ───────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name www.unc.edu.py;

        # Certificado comercial Sectigo (válido SOLO para www). fullchain = certificado + intermedios, en ese orden.
        ssl_certificate     /etc/nginx/certs/www_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/www_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — 2 years (matches Next.js headers)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Max upload size (for future form files)
        client_max_body_size 20m;

        # DOMINIOS-SSL-01: media pública del CMS bajo el host www. El CMS y el portal son dos apps Next que
        # chocan en /_next y /api, por eso el CMS no comparte host: solo se expone ESTA ruta (prefijo
        # `^~` = gana a cualquier regex). Cualquier otra ruta de /api en www es del portal.
        # Amenazas y límites: (1) solo GET/HEAD, para que por aquí no se pueda subir ni borrar; (2) no se
        # reenvían Cookie ni Authorization y no se devuelve Set-Cookie, así esta ruta solo ve lo público
        # (access.read de media es abierto en el CMS) y nunca una sesión del panel; (3) las cabeceras de
        # seguridad del CMS (CSP sandbox, nosniff, Cache-Control: mediaHeaders.ts) pasan sin tocar; un
        # add_header en el location anula los del server, por eso se repiten HSTS y nosniff (se oculta la
        # copia del CMS para no duplicarla). No hay caché en nginx. Límite: si el CMS cae, esta ruta da 502.
        location ^~ /api/media/file/ {
            limit_except GET HEAD {
                deny all;
            }

            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            # El CMS ve su host canónico, no el de www (evita lógica por host y dudas de CSRF/CORS).
            proxy_set_header   Host cms.unc.edu.py;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Cookie "";
            proxy_set_header   Authorization "";
            proxy_hide_header  Set-Cookie;
            proxy_hide_header  X-Content-Type-Options;

            add_header         Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header         X-Content-Type-Options "nosniff" always;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 5s;
        }

        # S3-SEAWEEDFS-01 / DOMINIOS-SSL-01: resolución en cada petición con el DNS interno de Docker, para
        # que nginx arranque aunque el contenedor s3 (perfil opcional) no exista; sin él, `/archivos/` da
        # 502 y el resto del sitio no se entera. La ruta `/archivos/` se genera desde templates/ (necesita
        # S3_BUCKET). Límite: sin keepalive hacia el almacén.
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/conf.d/*.location;

        location / {
            proxy_pass         http://portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 5s;
        }

        # Next.js static assets — cache aggressively (content-hashed filenames)
        location /_next/static/ {
            proxy_pass         http://portal_upstream;
            proxy_set_header   Host $host;
            expires            1y;
            add_header         Cache-Control "public, immutable";
        }
    }

    # ── cms.unc.edu.py (panel y API; certificado Let's Encrypt propio) ────────
    server {
        listen 443 ssl;
        http2  on;
        server_name cms.unc.edu.py;

        ssl_certificate     /etc/nginx/certs/cms_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/cms_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # NGX-01: tope de cuerpo del CMS = 12m (antes 100m). Orden deliberado de los límites, de fuera a
        # dentro: nginx 12m >= Next `proxyClientMaxBodySize: '12mb'` (apps/cms/next.config.mjs) > techo de
        # media 11 MiB + sobrecarga multipart (MEDIA_MAX_BYTES). nginx va igual o por encima de la app para
        # que un archivo de, p. ej., 11,5 MiB reciba el 413 limpio de la app y no un 413 genérico de nginx;
        # y por debajo de 100m para no consumir ancho de banda antes de rechazar. Si se sube MEDIA_MAX_BYTES o
        # proxyClientMaxBodySize, hay que subir este valor en el mismo cambio (lo vigila nginx-cms-limits).
        client_max_body_size 12m;

        # Rate-limit the login endpoint
        location /api/users/login {
            limit_req zone=cms_login burst=3 nodelay;
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # NGX-01: subida de media (`POST /api/media`, con o sin barra final). Mismo proxy que `location /`
        # (copiado porque el archivo se monta solo, sin include). El cupo de la zona cms_media aplica únicamente
        # a POST (ver map). 429 en vez del 503 por defecto de nginx. Hereda client_max_body_size 12m del server.
        location ~ ^/api/media/?$ {
            limit_req          zone=cms_media burst=5 nodelay;
            limit_req_status   429;
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 5s;
        }

        location / {
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 5s;
        }
    }
}
