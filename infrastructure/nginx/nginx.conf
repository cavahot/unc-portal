# ============================================================
# Portal UNC — Nginx Reverse Proxy (Production)
# ============================================================
# Domains served:
#   portal.unc.edu.py  → portal:3000   (Next.js portal)
#   cms.unc.edu.py     → cms:3000      (Payload CMS admin)
#   files.unc.edu.py   → unc-s3-prod:8333 (S3 SeaweedFS, solo GET/HEAD; OPCIONAL, perfil de Compose `s3`.
#                                        Con MEDIA_STORAGE=local responde 502: MIN-01, ver abajo)
#
# SSL certificates (Let's Encrypt):
#   Place fullchain.pem + privkey.pem inside infrastructure/nginx/certs/
#   Run certbot before first deploy:
#     certbot certonly --standalone -d portal.unc.edu.py \
#       -d cms.unc.edu.py -d files.unc.edu.py
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # Apply to CMS login to slow brute-force attempts.
    limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;

    # NGX-01: límite de tasa SOLO para `POST /api/media` (subida de archivos al CMS). limit_req no filtra
    # por método, así que la clave se calcula con map: vacía para todo método distinto de POST (nginx no
    # cuenta las peticiones con clave vacía) y la IP del cliente para POST. 10r/m con burst=5 (en la
    # location) permite una tanda corta de subidas de un editor y frena un abuso que llene el volumen
    # de media. Amenaza: editor comprometido o script que sube sin freno. Límite: la cuenta es por IP
    # (varios editores tras una misma IP comparten cupo; un atacante con muchas IP lo evita) y una carga
    # masiva legítima (cargador de imágenes) debe correr contra la red interna o con el límite
    # subido temporalmente; ver MIG-IMG §16.3.
    map $request_method $media_write_key {
        default "";
        POST    $binary_remote_addr;
    }
    limit_req_zone $media_write_key zone=cms_media:10m rate=10r/m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream portal_upstream {
        server portal:3000;
        keepalive 32;
    }

    upstream cms_upstream {
        server cms:3000;
        keepalive 16;
    }

    # MIN-01: no hay `upstream` hacia el almacén S3. Un `upstream` estático hacia el contenedor s3 se resuelve al ARRANCAR
    # nginx y, si el contenedor s3 no existe (perfil s3 apagado), nginx aborta con «host not found in upstream»
    # y se caen portal y cms. files.unc.edu.py lo resuelve en cada petición (ver su server más abajo).

    # ── HTTP → HTTPS redirect (all domains) ───────────────────────────────────
    server {
        listen 80;
        server_name portal.unc.edu.py cms.unc.edu.py files.unc.edu.py;

        location /.well-known/acme-challenge/ {
            # Let's Encrypt HTTP-01 challenge (for renewals with webroot plugin)
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── portal.unc.edu.py ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name portal.unc.edu.py;

        ssl_certificate     /etc/nginx/certs/portal_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/portal_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — 2 years (matches Next.js headers)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Max upload size (for future form files)
        client_max_body_size 20m;

        location / {
            proxy_pass         http://portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 5s;
        }

        # Next.js static assets — cache aggressively (content-hashed filenames)
        location /_next/static/ {
            proxy_pass         http://portal_upstream;
            proxy_set_header   Host $host;
            expires            1y;
            add_header         Cache-Control "public, immutable";
        }
    }

    # ── cms.unc.edu.py ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name cms.unc.edu.py;

        ssl_certificate     /etc/nginx/certs/cms_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/cms_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # NGX-01: tope de cuerpo del CMS = 12m (antes 100m). Orden deliberado de los límites, de fuera a
        # dentro: nginx 12m >= Next `proxyClientMaxBodySize: '12mb'` (apps/cms/next.config.mjs) > techo de
        # media 11 MiB + sobrecarga multipart (MEDIA_MAX_BYTES). nginx va igual o por encima de la app para
        # que un archivo de, p. ej., 11,5 MiB reciba el 413 limpio de la app y no un 413 genérico de nginx;
        # y por debajo de 100m para no consumir ancho de banda antes de rechazar. Si se sube MEDIA_MAX_BYTES o
        # proxyClientMaxBodySize, hay que subir este valor en el mismo cambio (lo vigila nginx-cms-limits).
        client_max_body_size 12m;

        # Rate-limit the login endpoint
        location /api/users/login {
            limit_req zone=cms_login burst=3 nodelay;
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # NGX-01: subida de media (`POST /api/media`, con o sin barra final). Mismo proxy que `location /`
        # (copiado porque el archivo se monta solo, sin include). El cupo de la zona cms_media aplica únicamente
        # a POST (ver map). 429 en vez del 503 por defecto de nginx. Hereda client_max_body_size 12m del server.
        location ~ ^/api/media/?$ {
            limit_req          zone=cms_media burst=5 nodelay;
            limit_req_status   429;
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 5s;
        }

        location / {
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 5s;
        }
    }

    # ── files.unc.edu.py (S3 SeaweedFS, lectura pública) ──────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name files.unc.edu.py;

        ssl_certificate     /etc/nginx/certs/files_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/files_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Allow large file uploads from the CMS
        client_max_body_size 500m;

        # MIN-01: resolución en cada petición con el DNS interno de Docker (127.0.0.11) y una variable en
        # proxy_pass, para que nginx arranque aunque el contenedor s3 no exista. Sin s3 responde 502
        # solo en este dominio. Límite: sin `keepalive` hacia el almacén (cada petición abre conexión).
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            # S3-SEAWEEDFS-01: este dominio solo SIRVE objetos públicos. Amenaza: escrituras/borrados por la
            # puerta pública (el CMS sube por la red interna, nunca por aquí). Límite: la autorización real
            # es la del almacén (la identidad anónima solo tiene Read:<bucket>); esto es una segunda barrera.
            limit_except GET HEAD {
                deny all;
            }

            set $s3_backend unc-s3-prod:8333;
            proxy_pass         http://$s3_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Agressive caching for immutable media assets
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-id-2;
            proxy_hide_header  x-amz-bucket-region;

            # SeaweedFS NO añade cabeceras de seguridad. Se repiten aquí porque un add_header dentro del
            # location anula los heredados del server (HSTS incluido).
            add_header         Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header         X-Content-Type-Options "nosniff" always;

            proxy_read_timeout  120s;
            proxy_send_timeout  120s;

            # Cache public GET responses in nginx for 1 day
            proxy_cache_valid  200 1d;
            add_header         Cache-Control "public, max-age=86400";
        }
    }
}
