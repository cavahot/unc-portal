# ============================================================
# Portal UNC — Nginx Reverse Proxy (Production)
# ============================================================
# Domains served:
#   portal.unc.edu.py  → portal:3000   (Next.js portal)
#   cms.unc.edu.py     → cms:3000      (Payload CMS admin)
#   files.unc.edu.py   → minio:9000    (MinIO S3 public bucket)
#
# SSL certificates (Let's Encrypt):
#   Place fullchain.pem + privkey.pem inside infrastructure/nginx/certs/
#   Run certbot before first deploy:
#     certbot certonly --standalone -d portal.unc.edu.py \
#       -d cms.unc.edu.py -d files.unc.edu.py
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # Apply to CMS login to slow brute-force attempts.
    limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream portal_upstream {
        server portal:3000;
        keepalive 32;
    }

    upstream cms_upstream {
        server cms:3000;
        keepalive 16;
    }

    upstream minio_upstream {
        server minio:9000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect (all domains) ───────────────────────────────────
    server {
        listen 80;
        server_name portal.unc.edu.py cms.unc.edu.py files.unc.edu.py;

        location /.well-known/acme-challenge/ {
            # Let's Encrypt HTTP-01 challenge (for renewals with webroot plugin)
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── portal.unc.edu.py ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name portal.unc.edu.py;

        ssl_certificate     /etc/nginx/certs/portal_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/portal_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — 2 years (matches Next.js headers)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Max upload size (for future form files)
        client_max_body_size 20m;

        location / {
            proxy_pass         http://portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 5s;
        }

        # Next.js static assets — cache aggressively (content-hashed filenames)
        location /_next/static/ {
            proxy_pass         http://portal_upstream;
            proxy_set_header   Host $host;
            expires            1y;
            add_header         Cache-Control "public, immutable";
        }
    }

    # ── cms.unc.edu.py ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name cms.unc.edu.py;

        ssl_certificate     /etc/nginx/certs/cms_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/cms_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Allow larger uploads for media files
        client_max_body_size 100m;

        # Rate-limit the login endpoint
        location /api/users/login {
            limit_req zone=cms_login burst=3 nodelay;
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 5s;
        }
    }

    # ── files.unc.edu.py (MinIO public read) ──────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name files.unc.edu.py;

        ssl_certificate     /etc/nginx/certs/files_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/files_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Allow large file uploads from the CMS
        client_max_body_size 500m;

        location / {
            proxy_pass         http://minio_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Agressive caching for immutable media assets
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-id-2;

            proxy_read_timeout  120s;
            proxy_send_timeout  120s;

            # Cache public GET responses in nginx for 1 day
            proxy_cache_valid  200 1d;
            add_header         Cache-Control "public, max-age=86400";
        }
    }
}
