# ============================================================
# Portal UNC — Production Docker Compose
# ============================================================
# Usage:
#   IMAGE_TAG=sha-xxxxxxx docker compose -f infrastructure/docker/compose.prod.yaml \
#     --env-file infrastructure/docker/.env.prod up -d
#   (DEP-09: IMAGE_TAG es obligatorio; en CI/CD lo pasa deploy.yml)
#
# Prerequisites:
#   1. Copy .env.prod.example → .env.prod and fill secrets
#   2. Place SSL certificates in infrastructure/nginx/certs/
#      (www.unc.edu.py: Sectigo comercial, copiado a mano como www_fullchain.pem/www_privkey.pem;
#       cms.unc.edu.py: Let's Encrypt con scripts/setup/rename-certs.sh; ver DEPLOY.md)
#   3. Build images:
#      docker compose -f infrastructure/docker/compose.prod.yaml build
# ============================================================

name: unc-prod

# DEP-07: entorno del CMS compartido con `cms-migrate` (mismo DATABASE_URI/getDatabaseURL y
# misma config de payload.config.ts) para que ambos vean exactamente la misma BD y secretos.
x-cms-env: &cms-env
    NODE_ENV:               production
    PAYLOAD_SECRET:         ${PAYLOAD_SECRET}
    # ARCH-DB-01: la URI completa llega desde .env.prod/Docker secrets;
    # nunca se construye con una contraseña literal dentro de este archivo.
    DATABASE_URI:           ${DATABASE_URI}
    # DEP-10: TLS hacia Postgres solo para una BD gestionada externa; `false` dentro de la red de Compose.
    POSTGRES_SSL:           ${POSTGRES_SSL:-false}
    # DEP-10: NEXT_PUBLIC_SERVER_URL = URL pública del CMS (convención de Payload); PORTAL_URL = URL pública
    # del portal (CORS, enlaces de preview y destino de /api/revalidate). Ambas salen de una sola variable de
    # .env.prod (CMS_PUBLIC_URL / PORTAL_PUBLIC_URL); el compose solo proyecta el nombre que lee cada código.
    # DOMINIOS-SSL-01: CMS_PUBLIC_URL (https://cms.unc.edu.py) alimenta SOLO al CMS; el portal usa MEDIA_PUBLIC_ORIGIN.
    NEXT_PUBLIC_SERVER_URL: ${CMS_PUBLIC_URL}
    PORTAL_URL:             ${PORTAL_PUBLIC_URL}

    # MIG-IMG fase 1: almacenamiento de `media`. Por defecto DISCO LOCAL en un volumen persistente
    # (cms_media montado en MEDIA_DIR). S3 (SeaweedFS) solo si se fija MEDIA_STORAGE=s3 de forma explícita:
    # las claves S3_* de abajo ya NO activan S3 por sí solas. MEDIA_DIR debe ser absoluto y coincidir con el
    # montaje del servicio `cms` (lo vigila el guard `guard-media-volume`). Quien usaba S3 debe fijar s3.
    MEDIA_STORAGE:   ${MEDIA_STORAGE:-local}
    MEDIA_DIR:       /app/media
    MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}

    # S3 (SeaweedFS) — var names must match what payload.config.ts reads
    # MIN-01 / S3-SEAWEEDFS-01: el almacén S3 es OPCIONAL (perfil `s3`). Con el perfil apagado estas variables no se usan, por eso
    # llevan default vacío: sin él Compose avisaría de variable sin definir en cada `up`. Con
    # MEDIA_STORAGE=s3 el CMS valida que no estén vacías y, si lo están, no arranca (mediaStorage.ts).
    S3_BUCKET:          ${S3_BUCKET:-}
    S3_ACCESS_KEY_ID:   ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    # Internal endpoint for uploads (container-to-container)
    S3_ENDPOINT:        http://s3:8333
    S3_REGION:          us-east-1
    # Public-facing URL used by generateFileURL — what browsers actually load
    S3_PUBLIC_URL:      ${S3_PUBLIC_URL:-}

    # Email (recuperación de contraseña de Payload). DEP-10: mismos nombres que usa el portal para el
    # formulario de contacto; SMTP_FROM (nombre obsoleto) lo sustituyen SMTP_FROM_ADDRESS y SMTP_FROM_NAME.
    SMTP_HOST:         ${SMTP_HOST}
    SMTP_PORT:         ${SMTP_PORT}
    SMTP_SECURE:       ${SMTP_SECURE}
    SMTP_USER:         ${SMTP_USER}
    SMTP_PASSWORD:     ${SMTP_PASSWORD}
    SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
    SMTP_FROM_NAME:    ${SMTP_FROM_NAME}

    # DEP-10: los dos extremos de preview y revalidación ISR deben compartir el mismo secreto (portal y CMS).
    PREVIEW_SECRET:      ${PREVIEW_SECRET}
    REVALIDATION_SECRET: ${REVALIDATION_SECRET}

    # DEP-10: webhook opcional de notificaciones editoriales; vacío = desactivado (el código lo omite).
    N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}


services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres-prod
    restart: unless-stopped
    networks: [internal]

    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 20s

    stop_grace_period: 30s

  # ── S3 / SeaweedFS (OPCIONAL, perfil `s3`) ─────────────────────────────────────
  # MIN-01 / S3-SEAWEEDFS-01: no forma parte del despliegue por defecto (MEDIA_STORAGE=local usa el volumen
  # cms_media). Un `docker compose up` normal NO lo arranca, no lo espera y el CMS no depende de él. Para usarlo:
  # MEDIA_STORAGE=s3 en .env.prod y `docker compose --profile s3 up -d s3`, luego crear el bucket con
  # scripts/s3/setup-bucket.mjs (ver DEPLOY.md y docs/specs/storage/S3-SEAWEEDFS-01.md). NO nombrar `s3` en el
  # `up -d` de deploy.yml: nombrar un servicio con perfil activa ese perfil
  # (docs.docker.com/compose/how-tos/profiles/). Sustituye a MinIO (quay.io/minio/minio devuelve 401).
  # Imagen fijada por digest sha256 (cierra DEP-11 para este servicio); cómo actualizarla: ver la spec.
  # Sin puertos publicados: nginx (ruta /archivos/ del host www) y el CMS lo alcanzan por la red `internal` en s3:8333.
  # Las claves salen de S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY de .env.prod; el entrypoint genera el JSON de
  # identidades al arrancar (no se versiona) y falla cerrado si faltan. S3_PUBLIC_READ=1 abre GET anónimo de
  # objetos del bucket (necesario para servir /archivos/ sin firmar); por defecto 0.
  s3:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    container_name: unc-s3-prod
    restart: unless-stopped
    networks: [internal]

    entrypoint: ["/bin/sh", "/s3-entrypoint.sh"]

    environment:
      S3_ACCESS_KEY_ID:     ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET:            ${S3_BUCKET:-unc-media}
      S3_PUBLIC_READ:       ${S3_PUBLIC_READ:-0}

    volumes:
      - s3_data:/data
      - ./s3/entrypoint.sh:/s3-entrypoint.sh:ro

    # /healthz responde 200 sin credenciales; GET / devuelve 403 (exige firma), por eso no se sondea la raíz.
    healthcheck:
      test:         ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval:     10s
      timeout:      5s
      retries:      10
      start_period: 15s

  # ── Payload CMS ──────────────────────────────────────────────────────────────
  cms:
    # In production: CI builds and pushes this image to ghcr.io.
    # The server just does `docker compose pull` — no source code needed.
    # DEP-09: despliegue por sha inmutable (`sha-xxxxxxx`), nunca `latest`. IMAGE_TAG es OBLIGATORIO:
    # sin él, cualquier `docker compose` sobre este archivo falla (no hay «latest implícito») y no
    # existe destino de rollback. Lo fija deploy.yml; a mano: `export IMAGE_TAG=sha-xxxxxxx`.
    image: ghcr.io/cavahot/unc-portal-cms:${IMAGE_TAG:?IMAGE_TAG obligatorio (sha-xxxxxxx)}
    build:
      context:    ../../
      dockerfile: apps/cms/Dockerfile
    container_name: unc-cms-prod
    restart: unless-stopped
    networks: [internal]

    depends_on:
      postgres:
        condition: service_healthy
      # MIN-01: sin `depends_on: s3`. Con MEDIA_STORAGE=local no se usa, y un depends_on a un servicio
      # de un perfil apagado haría fallar `up` («depends on undefined service»); `required: false` lo evitaría
      # pero exige Compose >= 2.20 y DEPLOY.md solo pide «v2.x». Con el perfil s3 el CMS puede arrancar antes
      # que el almacén S3: el cliente conecta al subir, y s3 tiene restart: unless-stopped.
      # DEP-07 (C8): el CMS no arranca (no sirve tráfico) si la migración no terminó con éxito.
      cms-migrate:
        condition: service_completed_successfully

    environment: *cms-env

    # MIG-IMG fase 1: archivos de `media` en un volumen NOMBRADO persistente (sobrevive a redeploys).
    # Docker copia al volumen vacío el contenido y el dueño (nextjs:nodejs, uid 1001) de /app/media de la
    # imagen (creado en apps/cms/Dockerfile), por eso el usuario sin privilegios puede escribir.
    # Límite: vive en el host; su respaldo fuera del host es DEP-08 (ver docs/BACKUP_RECOVERY.md).
    volumes:
      - cms_media:/app/media

    # DEP-09: readiness real (SELECT 1 a Postgres), no la liveness `{status:'ok'}`. Si la BD cae el
    # contenedor pasa a `unhealthy` (Docker no lo reinicia por eso) y `depends_on: service_healthy`
    # de portal/nginx lo respeta al arrancar. 4 llamadas/min desde localhost: bajo el límite de 30/min.
    healthcheck:
      # VERIF-DOCKER-04: 127.0.0.1 y no localhost (ver tests/deploy/docker-cms-image.test.mjs): localhost resuelve a ::1 y el wget de busybox no reintenta.
      test:         ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval:     15s
      timeout:      5s
      retries:      6
      start_period: 30s

  # ── Migraciones Payload (one-shot, DEP-07) ──────────────────────────────────
  # Ejecuta `payload migrate` (solo hacia adelante, idempotente) contra la misma BD que el CMS.
  # Se invoca explícitamente en deploy.yml (`run --rm cms-migrate`) DESPUÉS del pg_dump verificado
  # y ANTES de `up -d`; un código de salida != 0 aborta el deploy. NUNCA ejecuta down/reset/fresh.
  # Imagen: etapa `migrator` de apps/cms/Dockerfile (el runner no trae el CLI ni las migraciones).
  # DEP-09: mismo IMAGE_TAG obligatorio que cms y portal (antes CMS_IMAGE_TAG con default `latest`):
  # migrator y cms deben ser de la misma versión del código.
  cms-migrate:
    image: ghcr.io/cavahot/unc-portal-cms-migrator:${IMAGE_TAG:?IMAGE_TAG obligatorio (sha-xxxxxxx)}
    build:
      context:    ../../
      dockerfile: apps/cms/Dockerfile
      target:     migrator
    container_name: unc-cms-migrate-prod
    restart: "no"
    networks: [internal]

    depends_on:
      postgres:
        condition: service_healthy

    environment: *cms-env

  # ── Next.js Portal ───────────────────────────────────────────────────────────
  portal:
    # In production: CI builds and pushes this image to ghcr.io.
    # DEP-09: sha inmutable obligatorio (ver nota en `cms`).
    image: ghcr.io/cavahot/unc-portal:${IMAGE_TAG:?IMAGE_TAG obligatorio (sha-xxxxxxx)}
    build:
      context:    ../../
      dockerfile: Dockerfile
    container_name: unc-portal-prod
    restart: unless-stopped
    networks: [internal]

    depends_on:
      cms:
        condition: service_healthy

    environment:
      NODE_ENV:               production
      # DOMINIOS-SSL-01: NEXT_PUBLIC_CMS_URL = ORIGEN público donde se sirve /api/media/file/** (hoy el propio
      # host www, vía nginx), ya NO la URL del CMS. Obligatoria: sin ella las imágenes saldrían con un host erróneo.
      NEXT_PUBLIC_CMS_URL:    ${MEDIA_PUBLIC_ORIGIN:?MEDIA_PUBLIC_ORIGIN obligatoria (p. ej. https://www.unc.edu.py)}
      NEXT_PUBLIC_SITE_URL:   ${PORTAL_PUBLIC_URL}
      REVALIDATION_SECRET:    ${REVALIDATION_SECRET}
      MEDIA_HOSTNAME:         ${MEDIA_HOSTNAME}

      # DEP-10: URL INTERNA del CMS para las consultas servidor-a-servidor (lib/cms/client.ts); sin ella el
      # portal caería a http://localhost:3002 dentro de su propio contenedor. El CMS escucha en el puerto 3000.
      CMS_URL:                http://cms:3000
      # DEP-10: secreto de /api/preview (mismo valor que el CMS usa al generar el enlace de preview).
      PREVIEW_SECRET:         ${PREVIEW_SECRET}

      # DEP-10: formulario de contacto (app/api/contact/route.ts); mismos nombres SMTP que el CMS.
      SMTP_HOST:              ${SMTP_HOST}
      SMTP_PORT:              ${SMTP_PORT}
      SMTP_SECURE:            ${SMTP_SECURE}
      SMTP_USER:              ${SMTP_USER}
      SMTP_PASSWORD:          ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS:      ${SMTP_FROM_ADDRESS}
      CONTACT_TO:             ${CONTACT_TO}

      # Sentry — only DSN needed at runtime; ORG/PROJECT/AUTH_TOKEN are build-time
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}

    # DEP-09: liveness propia del portal (200 aunque el CMS esté caído; ver app/api/health/route.ts).
    healthcheck:
      test:         ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval:     15s
      timeout:      5s
      retries:      6
      start_period: 30s

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: unc-nginx-prod
    restart: unless-stopped
    networks: [internal]

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      portal:
        condition: service_healthy
      cms:
        condition: service_healthy

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      # DOMINIOS-SSL-01: webroot del desafío ACME (location /.well-known en :80) para renovar el certificado
      # de cms.unc.edu.py con `certbot --webroot` sin parar nginx. Debe existir en el host (mkdir -p /var/www/certbot).
      - /var/www/certbot:/var/www/certbot:ro
      # Plantilla de la ruta pública /archivos/ (S3): el entrypoint de nginx la renderiza con envsubst.
      - ../nginx/templates:/etc/nginx/templates:ro
      - nginx_logs:/var/log/nginx

    environment:
      # Solo S3_BUCKET se sustituye en la plantilla (filtro ^S3_BUCKET$): así no se tocan las variables de nginx
      # ($uri, $host...) ni se pasan secretos S3 al contenedor. Mismo default que el servicio s3.
      S3_BUCKET:              ${S3_BUCKET:-unc-media}
      NGINX_ENVSUBST_FILTER:  ^S3_BUCKET$$

volumes:
  postgres_data:
    name: unc_postgres_data_prod
  # No se migra el volumen anterior unc_minio_data_prod (formato distinto); ver docs/specs/storage/S3-SEAWEEDFS-01.md.
  s3_data:
    name: unc_s3_data_prod
  # MIG-IMG fase 1: archivos de `media` (almacenamiento local persistente del CMS).
  cms_media:
    name: unc_cms_media_prod
  nginx_logs:
    name: unc_nginx_logs_prod

networks:
  internal:
    name: unc-internal
    driver: bridge
