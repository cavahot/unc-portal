name: unc-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres-local
    restart: unless-stopped

    env_file:
      - ./.env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    stop_grace_period: 30s

volumes:
  postgres_data:
    name: unc_postgres_data
