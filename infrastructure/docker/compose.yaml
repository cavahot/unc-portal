name: unc-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres-local
    restart: unless-stopped

    env_file:
      - ./.env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    stop_grace_period: 30s

  minio:
    image: quay.io/minio/minio:latest
    container_name: unc-minio-local
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    env_file:
      - ./.env

    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: unc-mailpit-local
    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

    volumes:
      - mailpit_data:/data

    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_MAX_AGE: "14d"
      MP_LABEL: "UNC - Entorno local"
      TZ: America/Asuncion

volumes:
  postgres_data:
    name: unc_postgres_data

  minio_data:
    name: unc_minio_data

  mailpit_data:
    name: unc_mailpit_data