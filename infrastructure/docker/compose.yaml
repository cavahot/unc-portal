name: unc-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres-local
    restart: unless-stopped

    env_file:
      - ./.env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    stop_grace_period: 30s

  # ── Almacén S3 local (SeaweedFS) — S3-SEAWEEDFS-01 ───────────────────────────────
  # Sustituye a MinIO (sus imágenes comunitarias ya no se descargan: quay.io devuelve 401). Es OPCIONAL para
  # el CMS: solo se usa con MEDIA_STORAGE=s3. Imagen fijada por digest (nunca latest); para actualizarla ver
  # docs/specs/storage/S3-SEAWEEDFS-01.md. Las claves salen de S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY (archivo
  # .env de esta carpeta, fuera de git): sin ellas el entrypoint se niega a arrancar (falla cerrado). El JSON de
  # identidades se genera al arrancar, no se versiona. S3_PUBLIC_READ=1 abre lectura anónima SOLO de objetos del
  # bucket (por defecto cerrado). Crear el bucket con: node scripts/s3/setup-bucket.mjs
  s3:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    container_name: unc-s3-local
    restart: unless-stopped

    entrypoint: ["/bin/sh", "/s3-entrypoint.sh"]

    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-unc-media}
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-0}

    # Solo loopback: el puerto 9100 del host nunca se expone a la red local.
    ports:
      - "127.0.0.1:9100:8333"

    volumes:
      - s3_data:/data
      - ./s3/entrypoint.sh:/s3-entrypoint.sh:ro

    # /healthz responde 200 sin credenciales; GET / devuelve 403 (exige firma), por eso no se sondea la raíz.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: unc-mailpit-local
    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

    volumes:
      - mailpit_data:/data

    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_MAX_AGE: "14d"
      MP_LABEL: "UNC - Entorno local"
      TZ: America/Asuncion

volumes:
  postgres_data:
    name: unc_postgres_data

  # No se migra el volumen anterior unc_minio_data (formato distinto); ver docs/specs/storage/S3-SEAWEEDFS-01.md.
  s3_data:
    name: unc_s3_data

  mailpit_data:
    name: unc_mailpit_data